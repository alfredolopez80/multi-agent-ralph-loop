name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq curl
      
      - name: Guard against literal tildes
        # `~` entre comillas no se expande. Un commit copio REPO="~/..." a cuatro
        # scripts fail-open: 4,5 meses sin sincronizar reglas, en verde. El guard
        # va aqui ademas de en el pre-commit local, porque .git-hooks/ esta
        # gitignoreado y no llega a los demas clones.
        run: bash scripts/check-literal-tilde.sh --all

      - name: Guard against claude-mem residue
        # El check existia desde Wave 0 pero NINGUN runner lo invocaba: su unica
        # referencia era su propia cabecera. Llevaba en rojo sin que nadie lo
        # viera, mientras 26 CLAUDE.md seguian inyectando tablas de actividad de
        # enero en el contexto de cada sesion. --repo-only omite las
        # comprobaciones de la maquina local (vault, backup), que un runner
        # limpio no puede satisfacer.
        run: bash tests/security/test-claude-mem-removed.sh --repo-only

      - name: Validate shell syntax
        run: |
          # Validate ralph
          bash -n scripts/ralph
          # Validate ralph-doctor
          bash -n scripts/ralph-doctor.sh
          # Validate install script
          bash -n install.sh
      
      - name: Run shellcheck
        run: |
          # Check all bash scripts (with some exceptions for sourced files)
          shellcheck --severity=warning \
            scripts/ralph-doctor.sh \
            scripts/ralph \
            install.sh
      
      - name: Check executable permissions
        run: |
          # Ensure hooks are executable
          chmod +x .claude/hooks/*.sh
          chmod +x scripts/ralph
          chmod +x scripts/ralph-doctor.sh
      
      - name: Validate hooks structure
        run: |
          # Check hooks exist
          test -d .claude/hooks
          # Verify all hooks use a supported runtime extension.
          # Hooks are polyglot: Bash (.sh), Python (.py), and Node (.js/.mjs).
          for hook in .claude/hooks/*; do
            [ -f "$hook" ] || continue
            case "$hook" in
              *.sh|*.py|*.js|*.mjs) ;;
              *)
                echo "ERROR: Hook $hook has unsupported extension (expected .sh, .py, .js, or .mjs)"
                exit 1
                ;;
            esac
          done
      
      - name: Validate skills structure
        run: |
          # Check all skills have SKILL.md
          for skill_dir in .claude/skills/*/; do
            if [ -d "$skill_dir" ]; then
              if [ ! -f "${skill_dir}SKILL.md" ]; then
                echo "ERROR: Skill $(basename "$skill_dir") missing SKILL.md"
                exit 1
              fi
            fi
          done
          echo "✅ All skills have SKILL.md"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov
          # PyYAML: parses agent/skill frontmatter in the config tests. Optional at runtime
          # (those tests importorskip it), but installed here so they actually run in CI.
          if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; else pip install pyyaml; fi
      
      - name: Run pytest
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v --tb=short
          fi

      - name: Run harness tests
        run: |
          if [ -d "tests/harness" ]; then
            python -m pytest tests/harness/ -v --tb=short
          fi

  health-check:
    name: Ralph Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Run ralph-doctor (quick mode)
        run: |
          # Sin `|| true`: un doctor que no puede fallar es decorativo.
          bash scripts/ralph-doctor.sh --quick
